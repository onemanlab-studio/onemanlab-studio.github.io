<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneMan Lab - Μετάβαση...</title>
  
  <!-- Αυτόματη ανακατεύθυνση μέσω HTML Meta -->
  <meta http-equiv="refresh" content="1; url=https://onemanlab.blogspot.com/">
  
  <!-- Ακαριαία ανακατεύθυνση μέσω JavaScript -->
  <script>
    setTimeout(function() {
      window.location.replace("https://onemanlab.blogspot.com/");
    }, 300);
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 26px;
      letter-spacing: 1px;
      margin-bottom: 12px;
      color: #58a6ff;
    }
    p {
      font-size: 15px;
      color: #8b949e;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      background-color: #238636;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 24px;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }
    .btn:hover {
      background-color: #2ea043;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>OneMan Lab</h1>
    <p>Μεταφέρεστε αυτόματα στην επίσημη ιστοσελίδα μας...</p>
    <a href="https://onemanlab.blogspot.com/" class="btn">Πατήστε εδώ αν δεν μεταφερθείτε αυτόματα</a>
  </div>
</body>
</html>
